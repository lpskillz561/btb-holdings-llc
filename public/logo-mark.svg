<!--
  The BTB Holdings disc mark, for anywhere outside React that needs it: email
  signatures, letterhead, an OG image, a PDF header.

  Same geometry as <BtbMark> in src/components/Logo.tsx with the colours fixed
  to the default (navy disc, for light backgrounds). Change one and change the
  other. The favicon is a THIRD, deliberately different composition — see
  public/favicon.svg. The source artwork is in logo/.
-->
