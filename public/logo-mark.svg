  <circle cx="32" cy="32" r="32" fill="#032d60"/>
  <path d="M32 17.77 47.6 34.65H16.4z" fill="#ffffff"/>
  <rect x="13.69" y="39.35" width="36.67" height="2.33" fill="#1b96ff"/>
  <rect x="19.69" y="44.02" width="24.67" height="2.33" fill="#0176d3"/>
</svg>
