<!--
  Favicon variant of the BTB Holdings shield. (Replaces a leftover Ziora "Z"
  mark, which was off-palette and the wrong brand entirely.)

  Deliberately NOT the same file as the full mark. At 16px the inset keyline and
  the architrave collapse into the columns and the whole thing turns to mush, so
  this version drops both and widens the columns. Edit the two together.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <path d="M10 8h44a2 2 0 0 1 2 2v21c0 14.5-11.2 24.8-24 29.5C19.2 55.8 8 45.5 8 31V10a2 2 0 0 1 2-2z"
        fill="#0a1430"/>
  <g fill="#d4b876">
    <path d="M32 16 49 30.5H15z"/>
    <rect x="18" y="34.5" width="6" height="12"/>
    <rect x="29" y="34.5" width="6" height="12"/>
    <rect x="40" y="34.5" width="6" height="12"/>
    <rect x="15" y="48" width="34" height="4"/>
  </g>
</svg>
