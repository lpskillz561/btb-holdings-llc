<!--
  Favicon variant of the BTB Holdings mark, from logo/btb-logo-app-icon.png.

  Deliberately NOT the same composition as the disc in src/components/Logo.tsx.
  A disc inside a 16px square wastes the corners and shrinks the pediment to
  nothing, so the app-icon lockup bleeds the navy to the edges and gets a bigger
  triangle out of the same box. The two rules are thickened for the same reason
  they are in <BtbMark simplified> — true to the vector they are under a pixel
  here. Edit the two together.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#032d60"/>
  <path d="M32 19.06 46.19 34.47H17.78z" fill="#ffffff"/>
  <rect x="15.38" y="38.75" width="33.25" height="3.2" fill="#1b96ff"/>
  <rect x="20.75" y="43.4" width="22.5" height="3.2" fill="#0176d3"/>
</svg>
